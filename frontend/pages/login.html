<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StrayCare — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/auth.css"><link rel="stylesheet" href="../css/responsive.css">
</head><body>
  <div id="auth-overlay"><div class="auth-box">
    <div class="auth-header"><a class="brand auth-brand-link" href="home.html">Stray<em>Care</em></a><p>Rescue. Heal. Protect.</p></div>
    <div class="auth-body">
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Sign in to report, respond, or manage rescue cases.</div>
      <div class="auth-err" id="auth-err-login" role="alert" aria-live="assertive"></div>
      <form id="login-form" onsubmit="event.preventDefault();doLogin()">
        <div class="fgroup">
          <label class="flabel" for="auth-role">I am signing in as</label>
          <select id="auth-role" class="auth-role-select" required>
            <option value="">Choose your role</option>
            <option value="user">Community member</option>
            <option value="responder">Rescue responder</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div class="fgroup"><label class="flabel" for="auth-username">Username</label><input type="text" id="auth-username" placeholder="Enter your username" autocomplete="username" required></div>
        <div class="fgroup">
          <label class="flabel" for="auth-password">Password</label>
          <div class="auth-password-row">
            <input type="password" id="auth-password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="auth-password-toggle" id="auth-password-toggle" aria-pressed="false" onclick="toggleLoginPassword()">Show</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="login-btn" type="submit">Sign In →</button>
      </form>
      <div class="auth-divider">New to StrayCare?</div>
      <a class="btn btn-ghost btn-block auth-create-link" href="signup.html" onclick="goSignup();return false;">Create an account</a>
      <a class="auth-home-link" href="home.html">← Back to home</a>
    </div>
  </div></div>
  <div id="notif"><div class="notif-inner" id="notif-inner"></div></div>
  <script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/ui.js"></script><script src="../js/auth.js"></script>
</body></html>
